[project]
name = "arbiter"
version = "0.1.0"
description = "Automated reproduction of web bug reports, with an independent judge that must confirm every claim from evidence"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "playwright>=1.44",
  "opencv-python-headless>=4.9",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
arbiter = "arbiter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
