<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1b1f24}
main{max-width:640px;margin:0 auto;padding:0 16px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:16px;margin-bottom:14px}
.muted{color:#6b7280;font-size:13px}
#topbar{position:fixed;top:0;left:0;right:0;background:#2d3748;color:#fff;padding:12px 16px;z-index:5}
#topbar .sub{margin-left:12px;font-size:13px;color:#cbd5e0}
@media (max-width:600px){
  #topbar .sub{display:block;margin-left:0;margin-top:6px}
  #topbar{padding-bottom:28px}
}
</style></head><body>
<div id="topbar">
  <span style="font-weight:600">Dashboard</span>
  <span class="sub">Analytics workspace for the current quarter</span>
</div>
<div id="spacer" style="height:52px"></div>
<main>
  <div class="card" id="firstCard"><strong>Revenue</strong><p class="muted">Quarter to date performance summary.</p></div>
  <div class="card"><strong>Signups</strong><p class="muted">New accounts this week.</p></div>
</main>
</body></html>
