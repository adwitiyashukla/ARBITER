<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigator</title><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1b1f24}
header{background:#2d3748;color:#fff;padding:14px 18px;font-weight:600;font-size:17px}
main{max-width:640px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:16px;margin-bottom:14px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #2d3748;background:#2d3748;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#2d3748}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border:1px solid #c3c9d1;border-radius:6px;width:100%}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eef0f3}
.row{display:flex;gap:8px;align-items:center}
.muted{color:#6b7280;font-size:13px}
</style></head><body>
<header>Navigator</header><main>
<div class="card"><button id="toggle">Open menu</button><p class="muted">The side menu should glide open smoothly.</p></div>
<div id="drawer" style="position:fixed;top:0;left:-300px;width:300px;height:100%;background:#2d3748;color:#fff;padding:18px">
  <strong>Menu</strong>
  <ul style="margin-top:12px"><li style="border:0;color:#fff">Home</li><li style="border:0;color:#fff">Reports</li><li style="border:0;color:#fff">Settings</li></ul>
</div>
</main><script>
const d=document.getElementById('drawer'); let open=false, busy=false;
document.getElementById('toggle').onclick=()=>{
  if(busy) return; busy=true;
  const target = open ? -300 : 0;
  let pos = open ? 0 : -300;
  const step=()=>{
    pos += open ? -100 : 100;
    if((!open && pos>=target)||(open && pos<=target)){ pos=target; }
    d.style.left = pos + 'px';
    const t0=performance.now(); while(performance.now()-t0 < 90){}
    if(pos!==target){ setTimeout(step,150); } else { open=!open; busy=false;
      document.getElementById('toggle').textContent = open ? 'Close menu' : 'Open menu'; }
  };
  setTimeout(step,150);
};
</script></body></html>
