<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback</title><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1b1f24}
header{background:#2d3748;color:#fff;padding:14px 18px;font-weight:600;font-size:17px}
main{max-width:640px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:16px;margin-bottom:14px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #2d3748;background:#2d3748;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#2d3748}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border:1px solid #c3c9d1;border-radius:6px;width:100%}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eef0f3}
.row{display:flex;gap:8px;align-items:center}
.muted{color:#6b7280;font-size:13px}
</style></head><body>
<header>Feedback</header><main>
<div class="card">
  <label for="note">Your feedback</label><input id="note" value="Great product">
  <button id="submit" style="margin-top:12px">Submit</button>
</div>
<div class="card"><strong>Submitted</strong><ul id="entries"></ul><p class="muted" id="count">0 entries</p></div>
</main><script>
const entries=[];
document.getElementById('submit').addEventListener('click',()=>{
  const v=document.getElementById('note').value;
  // SEEDED BUG: no guard against a second click while the first submit is in flight.
  setTimeout(()=>{
    entries.push(v);
    const ul=document.getElementById('entries'); ul.innerHTML='';
    entries.forEach(e=>{const li=document.createElement('li');li.textContent=e;li.setAttribute('data-testid','entry');ul.appendChild(li);});
    document.getElementById('count').textContent=entries.length+' entries';
  },120);
});
</script></body></html>
