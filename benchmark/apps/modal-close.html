<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preferences</title><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1b1f24}
header{background:#2d3748;color:#fff;padding:14px 18px;font-weight:600;font-size:17px}
main{max-width:640px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:16px;margin-bottom:14px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #2d3748;background:#2d3748;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#2d3748}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border:1px solid #c3c9d1;border-radius:6px;width:100%}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eef0f3}
.row{display:flex;gap:8px;align-items:center}
.muted{color:#6b7280;font-size:13px}
</style></head><body>
<header>Preferences</header><main>
<div class="card"><button id="openBtn">Open settings</button></div>
<div id="overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45)">
  <div class="card" id="dialog" style="max-width:420px;margin:80px auto">
    <div class="row" style="justify-content:space-between">
      <strong>Settings</strong>
      <button id="closeX" class="secondary" aria-label="Close">X</button>
    </div>
    <label for="nick">Display name</label><input id="nick" value="Sam">
    <div class="row" style="margin-top:14px"><button id="saveBtn">Save</button>
    <button id="cancelBtn" class="secondary">Cancel</button></div>
  </div>
</div>
</main><script>
const ov=document.getElementById('overlay');
document.getElementById('openBtn').onclick=()=>ov.style.display='block';
document.getElementById('cancelBtn').onclick=()=>ov.style.display='none';
document.getElementById('saveBtn').onclick=()=>ov.style.display='none';
// SEEDED BUG: the close handler is attached to the dialog body, not to the X button,
// and it stops propagation, so clicking X does nothing at all.
document.getElementById('dialog').addEventListener('click',e=>{ e.stopPropagation(); });
document.getElementById('closeX').addEventListener('click',e=>{ e.preventDefault(); });
</script></body></html>
