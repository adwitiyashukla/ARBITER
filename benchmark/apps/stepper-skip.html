<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart</title><style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1b1f24}
header{background:#2d3748;color:#fff;padding:14px 18px;font-weight:600;font-size:17px}
main{max-width:640px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:16px;margin-bottom:14px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #2d3748;background:#2d3748;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#2d3748}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;padding:8px 10px;border:1px solid #c3c9d1;border-radius:6px;width:100%}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eef0f3}
.row{display:flex;gap:8px;align-items:center}
.muted{color:#6b7280;font-size:13px}
</style></head><body>
<header>Cart</header><main>
<div class="card">
  <strong>Blue notebook</strong>
  <div class="row" style="margin-top:12px">
    <button id="dec" class="secondary">-</button>
    <span id="qty" data-testid="qty" style="min-width:40px;text-align:center;font-size:18px">1</span>
    <button id="inc" class="secondary">+</button>
  </div>
  <p class="muted">Quantity should increase one at a time.</p>
</div>
</main><script>
let q=1;
const out=document.getElementById('qty');
function paint(){out.textContent=q;}
document.getElementById('inc').onclick=()=>{
  // SEEDED BUG: off-by-one, 2 jumps to 4
  q = (q===2) ? q+2 : q+1;
  paint();
};
document.getElementById('dec').onclick=()=>{ if(q>1){q-=1;paint();} };
paint();
</script></body></html>
